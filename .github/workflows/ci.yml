name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nativestudy
          MYSQL_ROOT_PASSWORD: ci-mysql-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-mysql-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        env:
          MYSQL_URL: jdbc:mysql://127.0.0.1:3306/nativestudy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ci-mysql-password
        run: ./gradlew test
